<!-- componente country-search-input -->
<app-country-search-input
  placeholder="Buscar por capital"
  (onSearch)="searchByCapital($event)"
></app-country-search-input>

<!-- componente country-list -->
@if (isError()) {
<div class="alert alert-danger mt-5">
  <strong>Error: </strong> {{ isError() }}
</div>
} @else {
<app-country-list [countries]="countries()"></app-country-list>
}
